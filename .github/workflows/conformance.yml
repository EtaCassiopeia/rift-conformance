name: conformance

# Layered CI per DESIGN.md §9. NOTE on the corpus dependency: the imposter corpus still lives in
# the (private) sibling repo `rift-imposter-samples` and hasn't been vendored in-repo yet — that
# migration is tracked by #16 (after which `RIFT_CORPUS_ROOT` defaults to `./corpus`). Until then CI
# cannot spawn the engine (its cwd is the corpus root) without a secret to fetch a private repo,
# which this workflow deliberately avoids. So the split is:
#   • compile-and-format  — push/PR, always: compiles + scalafmt-checks the whole suite. Needs
#                           NO engine and NO corpus, so it is a real, always-green PR gate today.
#   • plane-a-engine      — workflow_dispatch only (pending #16): builds rift@master and runs the
#                           Plane A suites against it. Flip its trigger to push/PR once #16 vendors
#                           the corpus.
#   • plane-b-container   — workflow_dispatch only (pending #12): Docker-gated container layer.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_engine:
        description: "Run the Plane A engine suites (needs a corpus; pending #16)"
        type: boolean
        default: false
      run_container:
        description: "Run the Docker-gated Plane B container layer (pending #12)"
        type: boolean
        default: false

jobs:
  compile-and-format:
    name: Compile + scalafmt (no engine, no corpus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up sbt
        uses: sbt/setup-sbt@v1
      - name: Compile + format check
        run: sbt -batch "Test/compile; scalafmtCheckAll; scalafmtSbtCheck"

  plane-a-engine:
    name: Plane A (engine) — pending corpus (#16)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_engine == true }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up sbt
        uses: sbt/setup-sbt@v1
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      # `build-rift.sh --ffi` builds the 3 engine binaries plus librift_ffi (for the not-yet-landed
      # embedded backend, #14), so one build step covers both Plane A and the future embedded leg.
      - name: Build rift engine (clean master)
        run: |
          eval "$(scripts/build-rift.sh --ffi)"
          echo "RIFT_BUILD_DIR=$RIFT_BUILD_DIR" >> "$GITHUB_ENV"
      - name: Run Plane A conformance (samples.rift.*)
        env:
          RIFT_MODE: external
          # Once #16 vendors the corpus in-repo this becomes ${{ github.workspace }}/corpus and this
          # job flips to a push/PR trigger.
          RIFT_CORPUS_ROOT: ${{ github.workspace }}/corpus
        run: sbt -batch engineConformance

  plane-b-container:
    name: Plane B container (Docker-gated, pending #12)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_container == true }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      # RIFT_MODE=container + `build-rift.sh --image` are #12; this job is a placeholder that builds
      # the image and reaches for scripts/conformance-rift.sh, so wiring the real container layer in
      # later is a content-only change to that script.
      - name: Build rift engine + container image
        run: |
          eval "$(scripts/build-rift.sh --image)"
          echo "RIFT_BUILD_DIR=$RIFT_BUILD_DIR" >> "$GITHUB_ENV"
      - name: Run Plane B rift-container layer (pending #12)
        env:
          RIFT_IT: "1"
          RIFT_IMAGE: rift-proxy:local
        run: ./scripts/conformance-rift.sh
