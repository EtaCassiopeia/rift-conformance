name: conformance

on:
  push:
  pull_request:
  workflow_dispatch:
  # Daily heartbeat (#121). The subject of this suite is an EXTERNAL engine, so triggering only on
  # harness commits is backwards: a quiet repo meant a green badge while the engine moved six
  # releases ahead. This runs the pinned version on a schedule, independent of any commit, so
  # environment rot (a withdrawn release asset, a runner image change) also surfaces within a day.
  schedule:
    - cron: "17 5 * * *"
  # Callable by rift-release-watch.yml with a candidate version, so the drift report reuses this
  # exact pipeline instead of a divergent copy of it.
  workflow_call:
    inputs:
      rift_version:
        description: "Engine version to test against (empty = the scripts/build-rift.sh pin)"
        type: string
        required: false
        default: ""

jobs:
  compile-and-format:
    name: compile & format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Compile + format check
        run: sbt -batch "Test/compile; scalafmtCheckAll; scalafmtSbtCheck"

  # Plane A against the real rift engine, fetched as a published release (#38 — no Rust build
  # needed). The corpus is vendored in-repo under ./corpus (#16), so this runs on every push/PR,
  # same as compile-and-format.
  plane-a-engine:
    name: Plane A — engine conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      # The released Linux rift binary dynamically links LuaJIT (the `lua` scripting engine), which
      # isn't on the bare runner — install it so `rift --version`/spawn works.
      - name: Install rift runtime deps (LuaJIT)
        run: sudo apt-get update && sudo apt-get install -y libluajit-5.1-2

      - name: Fetch released rift
        run: |
          # Fail the step if the fetch fails, rather than surfacing later as an empty RIFT_BUILD_DIR.
          out="$(scripts/build-rift.sh)" || { echo "build-rift.sh failed"; exit 1; }
          eval "$out"
          echo "RIFT_BUILD_DIR=$RIFT_BUILD_DIR" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Empty on push/PR/schedule -> build-rift.sh's `${RIFT_VERSION:-<pin>}` default applies.
          RIFT_VERSION: ${{ inputs.rift_version }}

      - name: Run Plane A conformance
        run: sbt -batch engineConformance
        env:
          RIFT_MODE: external
          # Explicit for clarity even though this now matches RiftHarnessConfig.DefaultCorpusRoot.
          RIFT_CORPUS_ROOT: ${{ github.workspace }}/corpus

  # Same Plane A oracle, run IN-PROCESS over Panama FFM (#18): zero process spawn, no Docker. Needs a
  # JDK 22+ runtime (the FFM binding jar is Java-22 bytecode — zio-bdd#247), so this job runs on JDK
  # 25 while the external job stays on 21. The engine is the bundled librift_ffi native; the released
  # rift is still fetched for the lint/verify tools + BUILD_INFO (used identically in both modes).
  plane-a-embedded:
    name: Plane A — engine conformance (embedded, FFM)
    runs-on: ubuntu-latest
    # Skipped for a candidate-version run, for the same reason as the container leg: the engine here
    # is zio-bdd's BUNDLED librift_ffi native, which RIFT_VERSION does not move (it only swaps the
    # lint/verify tools + BUILD_INFO underneath). Running it against a candidate would either report
    # a false green (the old native passing) or a false red (candidate tools paired with an old
    # native) — and both corrupt the drift verdict.
    if: ${{ !inputs.rift_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      # Both the released rift tools and the librift_ffi native dynamically link LuaJIT (scripting).
      - name: Install rift runtime deps (LuaJIT)
        run: sudo apt-get update && sudo apt-get install -y libluajit-5.1-2

      - name: Fetch released rift
        run: |
          out="$(scripts/build-rift.sh)" || { echo "build-rift.sh failed"; exit 1; }
          eval "$out"
          echo "RIFT_BUILD_DIR=$RIFT_BUILD_DIR" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # conformance-engine.sh (RIFT_MODE=embedded) runs the engineEmbedded suite subset and asserts
      # zero rift child processes were spawned.
      - name: Run Plane A conformance (embedded)
        run: scripts/conformance-engine.sh
        env:
          RIFT_MODE: embedded
          RIFT_CORPUS_ROOT: ${{ github.workspace }}/corpus

      # Plane B embedded (#18 acceptance): the MockControl corpus against the same in-process FFM
      # engine. This JDK-25 job is the only leg that can run it (JDK 22+), so AC6 is enforced here.
      - name: Run Plane B corpus (MOCK_BACKEND=embedded)
        run: sbt -batch mockEmbedded
        env:
          MOCK_BACKEND: embedded

  # Same Plane A oracle, run in a Docker container on a published image (#12): proves the transport
  # surface across the container boundary. ubuntu-latest ships a working Docker daemon, so this leg
  # opts in with RIFT_IT=1. Runs feature 01 (gate, minus the @full-corpus lua scenarios the published
  # image can't serve) + 03 (transport faults). The released rift is still fetched for the host
  # lint/verify tools + BUILD_INFO.
  plane-a-container:
    name: Plane A — engine conformance (container)
    runs-on: ubuntu-latest
    # Skipped for a candidate-version run: this leg runs a published image tag (RIFT_IMAGE), which
    # RIFT_VERSION does not move. Running it anyway would exercise the OLD image and report a green
    # that says nothing about the candidate — worse than not running it.
    if: ${{ !inputs.rift_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      # The released host rift-lint/rift-verify dynamically link LuaJIT.
      - name: Install rift runtime deps (LuaJIT)
        run: sudo apt-get update && sudo apt-get install -y libluajit-5.1-2

      - name: Fetch released rift
        run: |
          out="$(scripts/build-rift.sh)" || { echo "build-rift.sh failed"; exit 1; }
          eval "$out"
          echo "RIFT_BUILD_DIR=$RIFT_BUILD_DIR" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # conformance-engine.sh (RIFT_MODE=container, RIFT_IT=1) runs the engineContainer subset against
      # a testcontainers-managed rift on the published image.
      - name: Run Plane A conformance (container)
        run: scripts/conformance-engine.sh
        env:
          RIFT_MODE: container
          RIFT_IT: "1"
          RIFT_CORPUS_ROOT: ${{ github.workspace }}/corpus
